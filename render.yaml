services:
  - type: web
    name: nousbo-packaging
    runtime: python
    rootDir: app
    plan: free
    # seed_demo_data는 매 배포마다 자동 실행하지 않는다 — 실제 운영 데이터가 쌓인 뒤에는
    # 데모 계정 비밀번호 재설정과 데모 품목 재생성이 오히려 방해가 된다(완전삭제해도
    # 다음 배포에서 되살아남). 필요할 때만 관리자 화면(테스트 데이터 초기화/데모 데이터
    # 시드)에서 수동으로 실행한다.
    buildCommand: "pip install -r requirements.txt && python manage.py collectstatic --noinput && python manage.py migrate"
    startCommand: "gunicorn config.wsgi:application"
    envVars:
      - key: PYTHON_VERSION
        value: "3.13.1"
      - key: DJANGO_SECRET_KEY
        generateValue: true
      - key: DJANGO_DEBUG
        value: "False"
      - key: DATABASE_URL
        sync: false
      - key: BREVO_API_KEY
        sync: false
      - key: EMAIL_HOST
        sync: false
      - key: EMAIL_PORT
        sync: false
      - key: EMAIL_HOST_USER
        sync: false
      - key: EMAIL_HOST_PASSWORD
        sync: false
      - key: EMAIL_USE_TLS
        sync: false
      - key: DEFAULT_FROM_EMAIL
        sync: false
      - key: AWS_STORAGE_BUCKET_NAME
        sync: false
      - key: AWS_ACCESS_KEY_ID
        sync: false
      - key: AWS_SECRET_ACCESS_KEY
        sync: false
      - key: AWS_S3_ENDPOINT_URL
        sync: false
      - key: AWS_S3_REGION_NAME
        sync: false
      - key: PPURIO_ACCOUNT
        sync: false
      - key: PPURIO_API_SECRET
        sync: false
      - key: PPURIO_SENDER_PHONE
        sync: false
      - key: SOLAPI_API_KEY
        sync: false
      - key: SOLAPI_API_SECRET
        sync: false
      - key: SOLAPI_SENDER_PHONE
        sync: false
      - key: KAKAO_PF_ID
        sync: false
      - key: KAKAO_TEMPLATE_ID
        sync: false
      - key: VAPID_PUBLIC_KEY
        sync: false
      - key: VAPID_PRIVATE_KEY
        sync: false
      - key: VAPID_CLAIM_EMAIL
        sync: false
